<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОСВ как рентгеновский снимок — выберите отрасль</title>
<style>
  :root{
    --purple:#5b3b8c;
    --purple-deep:#3f2868;
    --purple-soft:#f3edf9;
    --purple-mid:#e4d7f0;
    --ink:#241a35;
    --muted:#7a7191;
    --line:#e7def1;
    --accent:#6f42a8;
    --accent-soft:#efe5f8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:#fff;
    font-size:16px;
    line-height:1.5;
  }
  .frame{
    max-width:100%;
    margin:0;
    background:#fff;
    border-radius:0;
    box-shadow:none;
    border:none;
    overflow:hidden;
  }
  .header{
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-deep) 100%);
    color:#fff;
    padding:14px 28px;
  }
  .header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.3;
  }
  .body{padding:16px 28px 20px}

  /* Сетка 5 x 3 = 15 плиток */
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .tile{
    position: relative;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px 2px 3px;
    cursor: pointer;
    text-align: center;
    transition: .15s;
    user-select: none;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 1px;
    color: var(--ink);
    min-height: 81px;
  }
  .tile:hover{
    border-color:var(--purple-mid);
    background:var(--purple-soft);
    transform:translateY(-1px);
  }
  .tile.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(111,66,168,.12);
  }
  .tile .icon{
    width:46px;
    height:46px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5a7ba8;
  }
  .tile .icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .tile .label{
    font-size:12px;
    line-height:1.2;
    color:var(--ink);
    font-weight:500;
  }
  .tile.active .label{color:var(--accent);font-weight:600}

  .actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
    margin-bottom:14px;
  }
  .btn{
    font-family:inherit;
    font-size:13px;
    padding:7px 14px;
    border-radius:10px;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:.15s;
    font-weight:600;
  }
  .btn-ghost{
    background:#fff;
    border-color:var(--line);
    color:var(--ink);
  }
  .btn-ghost:hover{border-color:var(--purple-mid);background:var(--purple-soft)}

  .count{
    font-size:13px;
    color:var(--muted);
    margin-right:auto;
  }
  .count strong{color:var(--ink)}

  .card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    background:#fff;
    transition:.2s;
  }
  .card.match{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
    background:#fdfbff;
  }
  .card h3{
    margin:0 0 6px;
    font-size:15.5px;
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    color:var(--purple-deep);
  }
  .card .num{
    display:inline-flex;
    width:22px;height:22px;
    align-items:center;justify-content:center;
    background:var(--purple-soft);
    border-radius:50%;
    font-size:11.5px;
    color:var(--purple);
    font-weight:700;
    flex:0 0 auto;
  }
  .card.match .num{background:var(--accent);color:#fff}
  .card .acc{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .card .acc b{color:var(--ink)}
  .card p{margin:6px 0 0;font-size:13.5px;color:#3d3454}
  .card .why{
    margin-top:10px;
    padding:8px 12px;
    background:var(--purple-soft);
    border-left:3px solid var(--purple-mid);
    border-radius:6px;
    font-size:12.5px;
    color:#5a4a75;
  }
  .card .why strong{color:var(--purple-deep)}
  .hidden{display:none !important}

  .empty{
    text-align:center;
    padding:24px 20px;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:14px;
    font-size:13.5px;
  }

  /* ---------- НИЖНЯЯ ПАНЕЛЬ КНОПОК ---------- */
  .footer-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-primary:hover{background:var(--purple-deep);border-color:var(--purple-deep)}
  .btn-primary svg{
    width:16px;
    height:16px;
    display:block;
    flex:0 0 auto;
  }
  .btn-outline{
    background:#fff;
    color:var(--accent);
    border-color:var(--accent);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-outline:hover{background:var(--accent-soft)}
  .btn-outline svg{
    width:16px;
    height:16px;
    display:block;
    flex:0 0 auto;
  }

  @media (max-width:820px){
    .grid{grid-template-columns:repeat(4,1fr)}
  }
  @media (max-width:600px){
    .header{padding:12px 16px}
    .header h1{font-size:15.5px}
    .body{padding:12px 14px 14px}
    .grid{grid-template-columns:repeat(3,1fr);gap:6px}
    .tile{padding:10px 6px 8px; min-height:88px; gap:6px}
    .tile .icon{width:36px;height:36px}
    .tile .label{font-size:10.5px}
    .card{padding:12px 14px}
    .footer-actions{flex-direction:column}
    .footer-actions .btn{width:100%;justify-content:center}
  }
  @media (max-width:400px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }

  /* ---------- ПЕЧАТЬ ---------- */
  @media print{
    .header{background:var(--purple) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .tile,
    .card,
    .card .why{ -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .actions,
    .footer-actions{display:none !important}
    .tile{cursor:default}
    .card{page-break-inside:avoid; break-inside:avoid}
    .body{padding:0}
  }
</style>
</head>
<body>
<div class="frame">

  <div class="header">
    <h1>Выберите интересующую вас отрасль — останутся только релевантные проверки</h1>
  </div>

  <div class="body">

    <div class="grid" id="industryGrid"></div>

    <div class="actions">
      <span class="count" id="countInfo">Показаны все проверки. Выберите интересующую вас отрасль</span>
      <button class="btn btn-ghost" id="resetBtn" type="button">Сбросить</button>
    </div>

    <div id="cards"></div>

    <div class="empty hidden" id="emptyState">
      По выбранным отраслям совпадений нет. Попробуйте выбрать другую
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ КНОПОК -->
    <div class="footer-actions">
      <button class="btn btn-primary" id="pdfBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M5 21h14"/>
        </svg>
        Сохранить в PDF
      </button>
      <button class="btn btn-outline" id="printBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9V3h12v6"/>
          <rect x="4" y="9" width="16" height="8" rx="1.5"/>
          <path d="M8 17h8v4H8z"/>
        </svg>
        Распечатать
      </button>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     КАРТИНКИ ОТРАСЛЕЙ
     ---------------------------------------------------------------------
     Файлы лежат в корне репозитория рядом с этим HTML.
     Только PNG. SVG-фолбэка нет.

     opt.png        — Оптовая торговля
     roznica.png    — Розничные сети
     proizv.png     — Производство
     agro.png       — Агробизнес
     transport.png  — Транспорт
     logist.png     — Логистика
     dobycha.png    — Добывающие компании
     sezon.png      — Сезонный бизнес
     stroyka.png    — Подрядчики и строительство
     proect.png     — Инжиниринговые компании
     IT.png         — ИТ
     telecom.png    — Телеком
     ===================================================================== */

  var IMG = {
    opt:       'opt.png',
    roznica:   'roznica.png',
    proizv:    'proizv.png',
    agro:      'agro.png',
    transport: 'transport.png',
    logist:    'logist.png',
    dobycha:   'dobycha.png',
    sezon:     'sezon.png',
    stroyka:   'stroyka.png',
    proect:    'proect.png',
    IT:        'IT.png',
    telecom:   'telecom.png'
  };

  // ---------- ОТРАСЛИ (12 плиток) ----------
  var INDUSTRIES = [
    { id:'opt',       label:'Оптовая торговля',           tags:['opt'] },
    { id:'roznica',   label:'Розничные сети',             tags:['roznica'] },
    { id:'proizv',    label:'Производство',               tags:['proizv'] },
    { id:'agro',      label:'Агробизнес',                 tags:['agro'] },
    { id:'transport', label:'Транспорт',                  tags:['transport'] },
    { id:'logist',    label:'Логистика',                  tags:['logist'] },
    { id:'dobycha',   label:'Добывающие компании',        tags:['dobycha'] },
    { id:'sezon',     label:'Сезонный бизнес',            tags:['sezon'] },
    { id:'stroyka',   label:'Подрядчики и строительство', tags:['stroyka'] },
    { id:'proect',    label:'Инжиниринговые компании',    tags:['proect'] },
    { id:'IT',        label:'ИТ',                         tags:['IT'] },
    { id:'telecom',   label:'Телеком',                    tags:['telecom'] }
  ];

  // ---------- ШЕСТЬ ПРОВЕРОК ----------
  var CARDS = [
    {
      n: 1,
      title: '«Треугольник ликвидности»: запасы + дебиторка + кредиторка',
      accounts: '10 · 41 · 43 · 60.01 · 62.01 · 90.01 · 51',
      tags: ['opt','roznica','proizv','agro'],
      text: 'Запасы и дебиторка растут быстрее выручки, а кредиторка не компенсирует рост. Ликвидность связывается в товаре и расчетах с клиентами.',
      why: 'В чем опасность: <strong>рост есть, а денег нет</strong>. Компания растет, но не высвобождает ликвидность, а связывает ее в товаре и расчетах с клиентами.'
    },
    {
      n: 2,
      title: '«Качели ликвидности»: длинный актив + короткие обязательства',
      accounts: '01 · 07 · 08 · 60 · 76 · 66 · 67',
      tags: ['proizv','transport','logist','roznica','agro','dobycha'],
      text: 'Растут капвложения и одновременно — краткосрочные кредиты и долг перед подрядчиками. Особенно опасен синхронный рост 08 и 66, если сроки ввода сдвигаются.',
      why: 'В чем опасность: <strong>длинный проект финансируется короткими деньгами</strong>. Пока банк продлевает лимит и проект идет по графику — равновесие держится.'
    },
    {
      n: 3,
      title: '«Петля обязательств»: банк + поставщики + налоги и зарплата',
      accounts: '51 · 60 · 66 · 67 · 68 · 69 · 70',
      tags: ['sezon','stroyka'],
      text: 'Все обязательства закрываются, но в последние допустимые даты. Компания живет от одного крупного поступления до другого.',
      why: 'В чем опасность: <strong>жизнь от поступления до поступления</strong>. Достаточно сбоя в одном звене — и придется выбирать, что оплачивать первым.'
    },
    {
      n: 4,
      title: '«Налоговый нож»: НДС с полученных авансов',
      accounts: '60.02 · 62.02 · 68 · субсчета НДС по авансам',
      tags: ['stroyka','proect','opt'],
      text: 'Получили аванс — начислили НДС, перечислили деньги поставщику — а вычет еще не заявлен. Разрыв финансируется из своих средств.',
      why: 'В чем опасность: <strong>ликвидность выпадает из оборота</strong>. Чем крупнее аванс и дольше период до вычета, тем больше своих денег надо вложить в налоговый разрыв.'
    },
    {
      n: 5,
      title: '«Воронка незавершенки»: затраты растут, но результатов нет',
      accounts: '20 · 23 · 25 · 26 · 43 · 90.02',
      tags: ['proizv','stroyka','proect'],
      text: 'Затраты идут на 20 и 23, НЗП растет, а выпуск по 43 не увеличивается. Ресурсы уходят — готовой продукции нет.',
      why: 'В чем опасность: <strong>непонятно, где нормальный цикл, а где проблемный проект</strong>. Внутри воронки могут скрываться брак, дефицит комплектующих или замороженные проекты.'
    },
    {
      n: 6,
      title: '«Лифт прибыли»: расходы вниз, активы вверх',
      accounts: '04 · 08 · 97 · 20 · 26 · 44 · 90.02 · 99',
      tags: ['IT','telecom','proect'],
      text: 'Растут 04, 08 или 97, а текущие расходы сокращаются. Прибыль растет не за счет операций, а за счет момента признания затрат.',
      why: 'В чем опасность: <strong>прибыль сегодня — нагрузка завтра</strong>. Амортизация, обесценение или списание, если активы не дадут ожидаемого эффекта.'
    }
  ];

  // ---------- СОСТОЯНИЕ ----------
  var selected = new Set();

  var gridEl   = document.getElementById('industryGrid');
  var cardsEl  = document.getElementById('cards');
  var countEl  = document.getElementById('countInfo');
  var emptyEl  = document.getElementById('emptyState');
  var resetBtn = document.getElementById('resetBtn');
  var pdfBtn   = document.getElementById('pdfBtn');
  var printBtn = document.getElementById('printBtn');

  // ---------- ПЛИТКИ ----------
  function renderGrid(){
    INDUSTRIES.forEach(function(ind){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile';
      btn.dataset.id = ind.id;

      var iconWrap = document.createElement('span');
      iconWrap.className = 'icon';

      var img = document.createElement('img');
      img.src = IMG[ind.id];
      img.alt = ind.label;
      img.loading = 'lazy';
      iconWrap.appendChild(img);

      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = ind.label;

      btn.appendChild(iconWrap);
      btn.appendChild(label);

      btn.addEventListener('click', function(){
        if (selected.has(ind.id)) {
          selected.delete(ind.id);
          btn.classList.remove('active');
        } else {
          selected.add(ind.id);
          btn.classList.add('active');
        }
        apply();
      });

      gridEl.appendChild(btn);
    });
  }

  // ---------- КАРТОЧКИ ----------
  function renderCards(){
    CARDS.forEach(function(c){
      var el = document.createElement('article');
      el.className = 'card';
      el.dataset.tags = c.tags.join('|');

      var h = document.createElement('h3');
      h.innerHTML = '<span class="num">' + c.n + '</span><span>' + c.title + '</span>';

      var acc = document.createElement('div');
      acc.className = 'acc';
      acc.innerHTML = '<b>Счета:</b> ' + c.accounts;

      var p = document.createElement('p');
      p.textContent = c.text;

      var why = document.createElement('div');
      why.className = 'why';
      why.innerHTML = c.why;

      el.appendChild(h);
      el.appendChild(acc);
      el.appendChild(p);
      el.appendChild(why);
      cardsEl.appendChild(el);
    });
  }

  // ---------- СБОР АКТИВНЫХ ТЕГОВ ----------
  function activeTags(){
    var tags = new Set();
    INDUSTRIES.forEach(function(ind){
      if (selected.has(ind.id)) {
        ind.tags.forEach(function(t){ tags.add(t); });
      }
    });
    return tags;
  }

  // ---------- ФИЛЬТР ----------
  function apply(){
    var tags = activeTags();
    var hasFilter = tags.size > 0;
    var cards = cardsEl.querySelectorAll('.card');
    var matchCount = 0;

    cards.forEach(function(card){
      var cardTags = card.dataset.tags.split('|');
      var isMatch = !hasFilter || cardTags.some(function(t){ return tags.has(t); });

      card.classList.toggle('match', hasFilter && isMatch);
      card.classList.toggle('hidden', hasFilter && !isMatch);

      if (isMatch) matchCount++;
    });

    if (!hasFilter) {
      countEl.innerHTML = 'Показаны все проверки. Отметьте отрасль.';
    } else {
      countEl.innerHTML = 'Подходит проверок: <strong>' + matchCount + ' из 6</strong>.';
    }

    emptyEl.classList.toggle('hidden', !(hasFilter && matchCount === 0));
  }

  // ---------- СБРОС ----------
  resetBtn.addEventListener('click', function(){
    selected.clear();
    document.querySelectorAll('.tile.active').forEach(function(t){ t.classList.remove('active'); });
    apply();
  });

  // ---------- СОХРАНИТЬ В PDF ----------
  pdfBtn.addEventListener('click', function(){
    // Открываем системный диалог печати: пользователь выбирает
    // «Сохранить как PDF» в списке принтеров.
    window.print();
  });

  // ---------- РАСПЕЧАТАТЬ ----------
  printBtn.addEventListener('click', function(){
    window.print();
  });

  // ---------- СТАРТ ----------
  renderGrid();
  renderCards();
  apply();

})();
</script>
</body>
</html>
