<title>ОСВ как рентгеновский снимок — выберите отрасль</title>
<style>
  :root{
    --purple:#5b3b8c;
    --purple-deep:#3f2868;
    --purple-soft:#f3edf9;
    --purple-mid:#e4d7f0;
    --ink:#241a35;
    --muted:#7a7191;
    --line:#e7def1;
    --accent:#6f42a8;
    --accent-soft:#efe5f8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:#fff;
    font-size:16px;
    line-height:1.5;
  }
  .frame{
    max-width:100%;
    margin:0;
    background:#fff;
    border-radius:0;
    box-shadow:none;
    border:none;
    overflow:hidden;
  }
  .header{
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-deep) 100%);
    color:#fff;
    padding:14px 28px;
  }
  .header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.3;
  }
  .body{padding:16px 28px 20px}

  /* Сетка 5 x 3 = 15 плиток */
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .tile{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 8px 12px;
    cursor:pointer;
    text-align:center;
    transition:.15s;
    user-select:none;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:8px;
    color:var(--ink);
    min-height:104px;
  }
  .tile:hover{
    border-color:var(--purple-mid);
    background:var(--purple-soft);
    transform:translateY(-1px);
  }
  .tile.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(111,66,168,.12);
  }
  .tile .icon{
    width:46px;
    height:46px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5a7ba8;
  }
  .tile .icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .tile .icon svg{
    width:42px;
    height:42px;
    display:block;
  }
  .tile.active .icon{color:var(--accent)}
  .tile .label{
    font-size:12px;
    line-height:1.2;
    color:var(--ink);
    font-weight:500;
  }
  .tile.active .label{color:var(--accent);font-weight:600}

  .actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
    margin-bottom:14px;
  }
  .btn{
    font-family:inherit;
    font-size:13px;
    padding:7px 14px;
    border-radius:10px;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:.15s;
    font-weight:600;
  }
  .btn-ghost{
    background:#fff;
    border-color:var(--line);
    color:var(--ink);
  }
  .btn-ghost:hover{border-color:var(--purple-mid);background:var(--purple-soft)}

  .count{
    font-size:13px;
    color:var(--muted);
    margin-right:auto;
  }
  .count strong{color:var(--ink)}

  .card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    background:#fff;
    transition:.2s;
  }
  .card.match{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
    background:#fdfbff;
  }
  .card h3{
    margin:0 0 6px;
    font-size:15.5px;
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    color:var(--purple-deep);
  }
  .card .num{
    display:inline-flex;
    width:22px;height:22px;
    align-items:center;justify-content:center;
    background:var(--purple-soft);
    border-radius:50%;
    font-size:11.5px;
    color:var(--purple);
    font-weight:700;
    flex:0 0 auto;
  }
  .card.match .num{background:var(--accent);color:#fff}
  .card .acc{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .card .acc b{color:var(--ink)}
  .card p{margin:6px 0 0;font-size:13.5px;color:#3d3454}
  .card .why{
    margin-top:10px;
    padding:8px 12px;
    background:var(--purple-soft);
    border-left:3px solid var(--purple-mid);
    border-radius:6px;
    font-size:12.5px;
    color:#5a4a75;
  }
  .card .why strong{color:var(--purple-deep)}
  .hidden{display:none !important}

  .empty{
    text-align:center;
    padding:24px 20px;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:14px;
    font-size:13.5px;
  }

  @media (max-width:820px){
    .grid{grid-template-columns:repeat(4,1fr)}
  }
  @media (max-width:600px){
    .header{padding:12px 16px}
    .header h1{font-size:15.5px}
    .body{padding:12px 14px 14px}
    .grid{grid-template-columns:repeat(3,1fr);gap:6px}
    .tile{padding:10px 6px 8px; min-height:88px; gap:6px}
    .tile .icon{width:36px;height:36px}
    .tile .icon svg{width:32px;height:32px}
    .tile .label{font-size:10.5px}
    .card{padding:12px 14px}
  }
  @media (max-width:400px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

      n: 6,
      title: '«Лифт прибыли»: расходы вниз, активы вверх',
      accounts: '04 · 08 · 97 · 20 · 26 · 44 · 90.02 · 99',
      tags: ['it','science','project','engineering'],
      text: 'Растут 04, 08 или 97, а текущие расходы сокращаются. Прибыль растет не за счет операций, а за счет момента признания затрат.',
      why: 'В чем опасность: <strong>прибыль сегодня — нагрузка завтра</strong>. Амортизация, обесценение или списание, если активы не дадут ожидаемого эффекта.'
    }
  ];

  // ---------- СОСТОЯНИЕ ----------
  var selected = new Set();

  var gridEl   = document.getElementById('industryGrid');
  var cardsEl  = document.getElementById('cards');
  var countEl  = document.getElementById('countInfo');
  var emptyEl  = document.getElementById('emptyState');
  var resetBtn = document.getElementById('resetBtn');

  // ---------- ПЛИТКИ ----------
  function renderGrid(){
    INDUSTRIES.forEach(function(ind){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile';
      btn.dataset.id = ind.id;

      var iconWrap = document.createElement('span');
      iconWrap.className = 'icon';

      var img = document.createElement('img');
      img.src = IMG[ind.id];
      img.alt = ind.label;
      img.onerror = function(){
        iconWrap.innerHTML = SVG[ind.id] || '';
      };
      iconWrap.appendChild(img);

      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = ind.label;

      btn.appendChild(iconWrap);
      btn.appendChild(label);

      btn.addEventListener('click', function(){
        if (selected.has(ind.id)) {
          selected.delete(ind.id);
          btn.classList.remove('active');
        } else {
          selected.add(ind.id);
          btn.classList.add('active');
        }
        apply();
      });

      gridEl.appendChild(btn);
    });
  }

  // ---------- КАРТОЧКИ ----------
  function renderCards(){
    CARDS.forEach(function(c){
      var el = document.createElement('article');
      el.className = 'card';
      el.dataset.tags = c.tags.join('|');

      var h = document.createElement('h3');
      h.innerHTML = '<span class="num">' + c.n + '</span><span>' + c.title + '</span>';

      var acc = document.createElement('div');
      acc.className = 'acc';
      acc.innerHTML = '<b>Счета:</b> ' + c.accounts;

      var p = document.createElement('p');
      p.textContent = c.text;

      var why = document.createElement('div');
      why.className = 'why';
      why.innerHTML = c.why;

      el.appendChild(h);
      el.appendChild(acc);
      el.appendChild(p);
      el.appendChild(why);
      cardsEl.appendChild(el);
    });
  }

  // ---------- СБОР АКТИВНЫХ ТЕГОВ ----------
  function activeTags(){
    var tags = new Set();
    INDUSTRIES.forEach(function(ind){
      if (selected.has(ind.id)) {
        ind.tags.forEach(function(t){ tags.add(t); });
      }
    });
    return tags;
  }

  // ---------- ФИЛЬТР ----------
  function apply(){
    var tags = activeTags();
    var hasFilter = tags.size > 0;
    var cards = cardsEl.querySelectorAll('.card');
    var matchCount = 0;

    cards.forEach(function(card){
      var cardTags = card.dataset.tags.split('|');
      var isMatch = !hasFilter || cardTags.some(function(t){ return tags.has(t); });

      card.classList.toggle('match', hasFilter && isMatch);
      card.classList.toggle('hidden', hasFilter && !isMatch);

      if (isMatch) matchCount++;
    });

    if (!hasFilter) {
      countEl.innerHTML = 'Показаны все проверки. Отметьте отрасль.';
    } else {
      countEl.innerHTML = 'Подходит проверок: <strong>' + matchCount + ' из 6</strong>.';
    }

    emptyEl.classList.toggle('hidden', !(hasFilter && matchCount === 0));
  }

  // ---------- СБРОС ----------
  resetBtn.addEventListener('click', function(){
    selected.clear();
    document.querySelectorAll('.tile.active').forEach(function(t){ t.classList.remove('active'); });
    apply();
  });

  // ---------- СТАРТ ----------
  renderGrid();
  renderCards();
  apply();

})();
</script>
</body>
</html>
